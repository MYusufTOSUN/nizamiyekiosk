[project]
name = "bilimfest"
version = "1.0.0"
description = "Pepper's Ghost hologram interaktif bilim insanı sergisi"
requires-python = ">=3.11"
authors = [{ name = "BilimFest Team" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1.0",
    "webrtcvad>=2.0.10",
    "sounddevice>=0.5.0",
    # PyTorch CUDA wheel kurulumu için bkz. README "Phase 2 / STT" bölümü:
    #   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
    # Buradaki "torch" satırı CPU fallback için; CUDA wheel yüklenirse override eder.
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
]
llm = [
    # llama-cpp-python CUDA wheel: README "Phase 3 / LLM" bölümüne bak.
    # Windows için en kolay: prebuilt CUDA wheel
    #   pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu121
    "llama-cpp-python>=0.3.0",
    # transformers <4.47 — 4.47+ torch 2.6 (AuxRequest) ister, bizde 2.5.1+cu121 var.
    "transformers>=4.40.0,<4.47.0",
    "sentence-transformers>=3.0.0,<3.4.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.8.0",
    "huggingface-hub>=0.24.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.0.0",
    # Opsiyonel cloud LLM fallback (claude_cloud provider) — internet gerektirir.
    "anthropic>=0.40.0",
]
tts = [
    # Coqui TTS — XTTS v2 multi-lingual TTS + ses klonlama.
    # Windows: torch>=2.0 + CUDA wheel zaten Phase 2'den kurulu.
    "TTS>=0.22.0",
    "pydub>=0.25.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.28.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "A", "C4", "T20", "SIM"]
ignore = [
    "S101",     # assert kullanımı — testlerde ve iç invariant'larda kabul
    "S110",     # try-except-pass — bilinçli cleanup blokları (close/cancel)
    "S607",     # partial executable path — nvidia-smi gibi bilinen araçlar
    "UP042",    # str+Enum — pydantic uyumu için bilinçli (StrEnum yerine)
    "ASYNC230", # async'te open() — config/cache okuması, sıcak yol değil
    "ASYNC240", # async'te pathlib metodu — ucuz fs metadata, kabul
    "SIM105",   # try-except-pass yerine contextlib.suppress — stil tercihi
    "SIM102",   # iç içe if — okunabilirlik için bilinçli
    "SIM117",   # iç içe with — testlerde okunabilirlik
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "ASYNC"]
# Operasyonel/etkileşimli script'ler: input(), while-sleep, uzun satır serbest
"scripts/**" = ["T20", "ASYNC250", "ASYNC110", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# GPU bağımlılıkları (torch/faster-whisper/TTS/llama-cpp) CI'da kurulu değil;
# o ortamda type: ignore[import-not-found] gerekli, lokalde "unused" görünür.
# Ortam-bağımsız tutarlılık için unused-ignore uyarısını kapat.
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests",
    "integration: integration tests",
    "unit: unit tests",
    "gpu: requires CUDA + faster-whisper",
]
