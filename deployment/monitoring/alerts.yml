groups:
  - name: bilimfest_critical
    interval: 30s
    rules:

      - alert: BilimFestDown
        expr: up{job="bilimfest_orchestrator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BilimFest orchestrator cevap vermiyor"
          description: "Servis 1 dakikadır down. Operator manual §3.6 'Sistem hiç açılmıyor'a bak."

      - alert: HighEndToEndLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(bilimfest_end_to_end_latency_ms_bucket[5m])) by (le)) > 4000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uçtan uca P95 > 4s — sergi kötüleşiyor"
          description: "Operator manual §3.1 'Cezerî çok yavaş yanıt veriyor'a bak."

      - alert: HighErrorRate
        expr: |
          sum(rate(bilimfest_errors_total[5m])) > 0.1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Hata oranı yüksek (>0.1/sn)"
          description: "Bileşen bazında hatalar artıyor; journalctl -u bilimfest -f"

      - alert: TooManyAbandonedSessions
        expr: |
          rate(bilimfest_sessions_total{status="abandoned"}[15m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ziyaretçi terk oranı yüksek"
          description: "Uzun gecikme + UX sorunu olabilir. Latency metriklerine bak."

      - alert: GPUHighVRAM
        expr: |
          sum(bilimfest_gpu_vram_usage_mb) > 14000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU VRAM kritik seviyede ({{ $value }} MB)"
          description: "Memory leak olabilir; restart önerilir."

  - name: bilimfest_28h_endurance
    interval: 5m
    rules:

      - alert: DiskFillingFast
        expr: |
          predict_linear(node_filesystem_free_bytes{mountpoint="/"}[1h], 6*3600) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk 6 saatte dolacak"
          description: "TTS cache + log rotation kontrol et."
