app:
  name: "bilimfest"
  version: "1.0.0"
  environment: "development"

audio:
  input:
    device: "default"
    sample_rate: 16000
    channels: 1
  output:
    device: "default"
    sample_rate: 24000
    channels: 6

# Phase 2 ile gerçek STT (Whisper). Diğer modüller hala mock.
# Mock'a geri dönmek için: provider: "mock" + config: {}
stt:
  provider: "whisper_local"
  config:
    # Yerel klasör — internet kesilse bile yüklenir.
    # Kısa ad "large-v3" verirseniz faster-whisper kendisi HuggingFace'ten indirir.
    model: "data/models/whisper/faster-whisper-large-v3"
    language: "tr"
    device: "cuda"            # "cuda" varsa otomatik kullanır, yoksa "cpu" yap
    compute_type: "int8_float16"   # 8 GB VRAM için en iyi denge
    model_dir: "data/models/whisper"
    cpu_threads: 4
    num_workers: 1
    sample_rate: 16000
    beam_size: 5
    best_of: 5
    temperature: 0.0
    vad_threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 800
    max_segment_duration_seconds: 30
    min_segment_duration_ms: 500
    flush_on_stream_end: true

llm:
  provider: "llama_local"
  config:
    model_path: "data/models/llama/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    n_gpu_layers: -1            # tüm katmanlar GPU'ya (8B Q4 ~5 GB)
    n_ctx: 4096
    n_batch: 512
    n_threads: 4
    use_mmap: true
    use_mlock: false
    verbose: false
    max_tokens: 220
    temperature: 0.6
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.15
  rag:
    enabled: true
    similarity_threshold: 0.85   # 0.85+ → kesin topic match; 0.65-0.85 false-positive (X nasıl yapılır ↔ X nasıl çalışır)
    store_path: "data/responses/vector_store"

tts:
  provider: "xtts_local"
  config:
    model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
    voices_dir: "data/voices"
    device: "cuda"
    language: "tr"
    builtin_speaker: "Damien Black"   # ses klonu yokken default erkek ses
    stream_chunk_size: 20
    output_chunk_samples: 480

lipsync:
  # Sergi makinesinde "audio2face" olacak. PC versiyonda mock (RMS tabanlı
  # jawOpen + göz kırpma) yeterli — Unreal bridge sahnesini test edebilir.
  provider: "mock"
  config: {}
  # Audio2Face Streaming için örnek:
  # provider: "audio2face"
  # config:
  #   host: "127.0.0.1"
  #   port: 8011
  #   sample_rate: 24000

unreal_bridge:
  provider: "mock"
  udp_host: "127.0.0.1"
  udp_port: 12345
  tcp_host: "127.0.0.1"
  tcp_port: 12346

session:
  max_duration_seconds: 180
  silence_timeout_seconds: 15

metrics:
  prometheus_port: 9090
  log_level: "INFO"
  json_logs: true
