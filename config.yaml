app:
  name: "bilimfest"
  version: "1.0.0"
  environment: "development"

audio:
  input:
    device: "default"
    sample_rate: 16000
    channels: 1
  output:
    device: "default"
    sample_rate: 24000
    channels: 6

# Phase 2 ile gerçek STT (Whisper). Diğer modüller hala mock.
# Mock'a geri dönmek için: provider: "mock" + config: {}
stt:
  provider: "whisper_local"
  config:
    # Yerel klasör — internet kesilse bile yüklenir.
    # Kısa ad "large-v3" verirseniz faster-whisper kendisi HuggingFace'ten indirir.
    model: "data/models/whisper/faster-whisper-large-v3"
    language: "tr"
    device: "cuda"            # "cuda" varsa otomatik kullanır, yoksa "cpu" yap
    compute_type: "int8_float16"   # 8 GB VRAM için en iyi denge
    model_dir: "data/models/whisper"
    cpu_threads: 4
    num_workers: 1
    sample_rate: 16000
    beam_size: 5                  # çocuk/kısa cümle doğruluğu kritik → 1'den 5'e
    best_of: 5                    # ("sen nerelisin"i yanlış duyma riskini azaltır)
    temperature: 0.0
    # Decoder'ı Türkçe + domain sözlüğüne yönlendir → "Cezeri", "fil saati",
    # "otomat", "dişli", "mıknatıs" gibi terimleri çocuk telaffuzunda daha iyi
    # yakalar. Ölçülü tut (uzun/isim-dolu prompt sessizlikte halüsinasyon riski).
    initial_prompt: "El-Cezerî ile robot, otomat, fil saati, su saati, dişli çark, mıknatıs ve bilim hakkında Türkçe sohbet."
    vad_threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 250   # 400→250ms — natural pause toleransı korunur, 150ms kazanç
    max_segment_duration_seconds: 30
    min_segment_duration_ms: 500
    flush_on_stream_end: true

llm:
  # Varsayılan LLM = Claude cloud (Haiku) — RAG-miss fallback'i için.
  # Yerel Llama'ya / güçlü GPU'ya gerek yok. Anahtar ANTHROPIC_API_KEY ortam
  # değişkeninden okunur (koda gömülmez). Tam OFFLINE çalışmak istersen
  # provider'ı 'llama_local' yapıp aşağıdaki yorumlu bloğu aç.
  provider: "claude_cloud"
  config:
    model: "claude-haiku-4-5"   # daha kaliteli Türkçe için "claude-sonnet-4-6"
    max_tokens: 150
    timeout_seconds: 30.0
  # --- OFFLINE alternatif (internet yoksa) ---
  # provider: "llama_local"
  # config:
  #   model_path: "data/models/llama/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
  #   n_gpu_layers: 15          # 8 GB'da güvenli; -1 = tüm katmanlar GPU (16+ GB)
  #   n_ctx: 4096
  #   n_batch: 512
  #   n_threads: 8
  #   use_mmap: true
  #   use_mlock: false
  #   verbose: false
  #   max_tokens: 100
  #   temperature: 0.4
  #   top_p: 0.9
  #   top_k: 40
  #   repeat_penalty: 1.15
  rag:
    enabled: true
    # RERANKER REJIMI. similarity_threshold burada RERANKER'ın sigmoid skoruna
    # uygulanır (embedding rejimindeki 0.86 DEĞİL). eval_rag.py --reranker ile
    # 128 adversarial probe üzerinde tune edildi (kimlik/bilinen-bilinmeyen kişi/
    # çocuk-dili/alan-dışı/asr-noise):
    #   reranker 0.62 → correct=67, wrong_hit=3 (zararsız intra-DB), correct_miss=37/37
    #   yani TÜM bilinmeyen kişiler (Atatürk, Hawking, Messi...) + alan-dışı sorular
    #   DOĞRU şekilde LLM'e düşüyor. Embedding-only ile bunlar ~0.87 ile yanlış
    #   hazır-cevaba yapışıyordu ("X tanıyor musun" şablonu embedding'e hâkim olunca).
    #   Cross-encoder query<->aday tam attention'la "Atatürk != Einstein" diyebiliyor.
    # HIZ: reranker sadece top-12 adayı + KISA match_text ile çalışır (cevap metni
    #   değil) → CPU'da ~9 sn yerine ~0.5 sn. match_text skor rejimi eşiği 0.62.
    # NOT: use_reranker:false yaparsan bu eşiği 0.86'ya geri al (rejimler farklı).
    similarity_threshold: 0.62
    margin: 0.0
    use_reranker: true
    # e5 embedder + reranker CPU'da: Whisper(CTranslate2) + torch cuDNN çakışması,
    # ilk GPU inference'ında pipeline'ı sessizce çökertiyordu (C-seviyesi abort).
    # CPU'da e5 ~130ms + reranker ~150ms = tur başına ~300ms, kritik yolda değil;
    # üstelik VRAM Llama'ya kalır. Sergi makinesi (16 GB) cuda kullanır.
    embedding_device: "cpu"
    reranker_model: "data/models/reranker/bge-reranker-v2-m3"
    store_path: "data/responses/vector_store"

tts:
  # === Ses = Microsoft Edge Neural — Türkçe AhmetNeural (doğal Türkçe erkek ses) ===
  # pitch_hz: ton (negatif = daha tok/heybetli). -8 ≈ normal/derin arası "ara".
  # ÇEVRİMİÇİ (internet gerekir; tekrarlar cache'ten offline). Tam offline için
  # aşağıdaki yorumlu xtts_local bloğunu aç.
  provider: "edge_tts"
  config:
    voice: "tr-TR-AhmetNeural"
    pitch_hz: -8        # -5 hafif · -8 ara · -11 belirgin · -15 derin · -30 çok derin · -45 heybetli
    rate_pct: -2        # konuşma hızı (%, negatif = ağır/vakur)
    cache_enabled: true
    cache_dir: "data/tts_cache"
  # --- OFFLINE alternatif (internet yoksa) — yerel XTTS (Damien Black builtin) ---
  # provider: "xtts_local"
  # config:
  #   model_path: "data/models/xtts_v2"
  #   model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
  #   voices_dir: "data/voices"
  #   device: "cuda"
  #   language: "tr"
  #   builtin_speaker: "Damien Black"
  #   use_voice_clone: false
  #   speed: 1.1
  #   stream_chunk_size: 20
  #   output_chunk_samples: 480

lipsync:
  # Sergi makinesinde "audio2face" olacak. PC versiyonda mock (RMS tabanlı
  # jawOpen + göz kırpma) yeterli — Unreal bridge sahnesini test edebilir.
  provider: "mock"
  config: {}
  # Audio2Face Streaming için örnek:
  # provider: "audio2face"
  # config:
  #   host: "127.0.0.1"
  #   port: 8011
  #   sample_rate: 24000

unreal_bridge:
  provider: "mock"
  udp_host: "127.0.0.1"
  udp_port: 12345
  tcp_host: "127.0.0.1"
  tcp_port: 12346

session:
  max_duration_seconds: 180
  silence_timeout_seconds: 15

metrics:
  prometheus_port: 9090
  log_level: "INFO"
  json_logs: true
