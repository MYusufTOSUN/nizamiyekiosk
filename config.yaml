app:
  name: "bilimfest"
  version: "1.0.0"
  environment: "development"

audio:
  input:
    device: "default"
    sample_rate: 16000
    channels: 1
  output:
    device: "default"
    sample_rate: 24000
    channels: 6

# Phase 2 ile gerçek STT (Whisper). Diğer modüller hala mock.
# Mock'a geri dönmek için: provider: "mock" + config: {}
stt:
  provider: "whisper_local"
  config:
    # Yerel klasör — internet kesilse bile yüklenir.
    # Kısa ad "large-v3" verirseniz faster-whisper kendisi HuggingFace'ten indirir.
    model: "data/models/whisper/faster-whisper-large-v3"
    language: "tr"
    device: "cuda"            # "cuda" varsa otomatik kullanır, yoksa "cpu" yap
    compute_type: "int8_float16"   # 8 GB VRAM için en iyi denge
    model_dir: "data/models/whisper"
    cpu_threads: 4
    num_workers: 1
    sample_rate: 16000
    beam_size: 1                  # 5→1: STT ~300ms hızlanır, kalite düşüşü minimal
    best_of: 1
    temperature: 0.0
    vad_threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 250   # 400→250ms — natural pause toleransı korunur, 150ms kazanç
    max_segment_duration_seconds: 30
    min_segment_duration_ms: 500
    flush_on_stream_end: true

llm:
  provider: "llama_local"
  config:
    model_path: "data/models/llama/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    # n_gpu_layers:
    #   0  → CPU only (1 tok/s, çok yavaş)
    #  -1  → tüm katmanlar GPU (sergi makinesi 16+ GB VRAM)
    #   N  → ilk N katman GPU, kalanı CPU (hibrit)
    # Llama 8B Q4 = 32 transformer + embed. Her katman ~150 MB.
    # 20 katman ≈ 3 GB GPU (STT+TTS+e5 = 5.5 GB üstüne, toplam 8.5 GB - sıkışır).
    # 15 katman ≈ 2.3 GB GPU — daha güvenli.
    n_gpu_layers: 15
    n_ctx: 4096
    n_batch: 512
    n_threads: 8                # 7840HS 8C/16T — tam fizik çekirdek
    use_mmap: true
    use_mlock: false
    verbose: false
    max_tokens: 100              # 220 → 100: 2 cümlelik kısa cevap için
    temperature: 0.6
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.15
  rag:
    enabled: true
    # eval_rag.py tuning sonucu (per-example embedding): 0.84 + margin 0.02 →
    # 20/25 doğru hit, 0 alakasız hit, 10/10 miss doğru. Eski 0.75 yanlış-hit veriyordu.
    similarity_threshold: 0.84
    margin: 0.02
    store_path: "data/responses/vector_store"

tts:
  provider: "xtts_local"
  config:
    # Yerel snapshot — config.json + model.pth + vocab.json bekler.
    # Boş bırakırsan Coqui gateway'inden otomatik indirir (yavaş/güvenilmez).
    model_path: "data/models/xtts_v2"
    model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
    voices_dir: "data/voices"
    # XTTS tek başına CUDA'da hızlı (RTF 0.8). Ama Whisper+CTranslate2 önce
    # yüklenirse cuDNN sürüm konflikti çıkar; pipeline script'i bu durumda
    # device'ı CPU'ya zorlar. Sergi makinesinde tek model olduğu için "cuda" kal.
    device: "cuda"
    language: "tr"
    builtin_speaker: "Damien Black"   # ses klonu yokken default erkek ses
    stream_chunk_size: 20
    output_chunk_samples: 480

lipsync:
  # Sergi makinesinde "audio2face" olacak. PC versiyonda mock (RMS tabanlı
  # jawOpen + göz kırpma) yeterli — Unreal bridge sahnesini test edebilir.
  provider: "mock"
  config: {}
  # Audio2Face Streaming için örnek:
  # provider: "audio2face"
  # config:
  #   host: "127.0.0.1"
  #   port: 8011
  #   sample_rate: 24000

unreal_bridge:
  provider: "mock"
  udp_host: "127.0.0.1"
  udp_port: 12345
  tcp_host: "127.0.0.1"
  tcp_port: 12346

session:
  max_duration_seconds: 180
  silence_timeout_seconds: 15

metrics:
  prometheus_port: 9090
  log_level: "INFO"
  json_logs: true
