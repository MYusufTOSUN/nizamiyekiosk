<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nizamiye Medresesi</title>
<style>
  :root{
    --bg0:#070a14; --bg1:#10152a; --bg2:#1c1430;
    --gold:#e6b94e; --gold-soft:#f3d488; --cream:#f5ecd6;
    --muted:#9aa3bd; --ring:#e6b94e; --holo:#7fe9ff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 800px at 50% 18%, #21183a 0%, var(--bg1) 45%, var(--bg0) 100%);
    color:var(--cream); overflow:hidden; height:100vh; position:relative;
    -webkit-user-select:none; user-select:none; cursor:none;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.06;
    background-image:repeating-conic-gradient(from 30deg, transparent 0 28deg, #d4a84322 28deg 30deg);
    background-size:220px 220px;
  }
  .brand{position:fixed; top:3.2vh; left:0; right:0; text-align:center; letter-spacing:.42em;
         font-size:1.05rem; color:var(--gold); opacity:.85; font-weight:600; z-index:6}
  .brand small{display:block; letter-spacing:.25em; font-size:.62rem; color:var(--muted); margin-top:.5em}
  .dot{position:fixed; top:3.4vh; right:3vw; width:9px; height:9px; border-radius:50%;
       background:#d9534f; box-shadow:0 0 10px #d9534f; transition:background .3s; z-index:7}
  .dot.on{background:#5cb85c; box-shadow:0 0 10px #5cb85c}

  /* ===== TEK KARAKTER GÖRÜNÜMÜ (seçimden sonra) ===== */
  .wrap{position:relative; height:100%; display:flex; flex-direction:column; align-items:center;
        justify-content:center; text-align:center; padding:5vh 6vw; z-index:2}
  body[data-state="selection"] .wrap{display:none}

  .name{font-family:"Georgia","Times New Roman",serif; font-size:clamp(2.6rem,6.5vw,5.4rem);
        color:var(--gold-soft); text-shadow:0 0 40px #e6b94e55; line-height:1; margin-bottom:.25em}
  .tagline{color:var(--muted); letter-spacing:.18em; font-size:clamp(.7rem,1.6vw,1rem); margin-bottom:6vh}

  .orb-wrap{position:relative; width:min(38vh,320px); height:min(38vh,320px); margin-bottom:5vh}
  .orb{position:absolute; inset:0; border-radius:50%;
       background:radial-gradient(circle at 38% 34%, #fff3d0 0%, var(--gold) 38%, #9a6b18 78%, #4a3208 100%);
       box-shadow:0 0 70px #e6b94e66, inset 0 0 50px #00000055; animation:breathe 4.5s ease-in-out infinite}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid var(--ring); opacity:0; transform:scale(1)}
  @keyframes breathe{0%,100%{transform:scale(.97); filter:brightness(.92)} 50%{transform:scale(1.03); filter:brightness(1.1)}}
  @keyframes ripple{0%{opacity:.55; transform:scale(1)} 100%{opacity:0; transform:scale(1.9)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  body[data-state="listening"] .orb{animation:breathe 1.6s ease-in-out infinite}
  body[data-state="listening"] .ring{animation:ripple 2.2s ease-out infinite}
  body[data-state="listening"] .ring:nth-child(2){animation-delay:.7s}
  body[data-state="listening"] .ring:nth-child(3){animation-delay:1.4s}
  body[data-state="thinking"] .orb{animation:breathe 2.4s ease-in-out infinite; filter:saturate(.8)}
  .thinker{position:absolute; inset:-14px; border-radius:50%; border:3px solid transparent;
           border-top-color:var(--gold-soft); border-right-color:#e6b94e55; opacity:0}
  body[data-state="thinking"] .thinker{opacity:1; animation:spin 1.4s linear infinite}
  body[data-state="speaking"] .orb{animation:breathe 1s ease-in-out infinite; box-shadow:0 0 100px #e6b94e99, inset 0 0 50px #00000055}
  body[data-state="speaking"] .ring{animation:ripple 1.1s ease-out infinite}

  .status{font-size:clamp(1rem,2.4vw,1.5rem); letter-spacing:.14em; color:var(--gold-soft);
          min-height:1.4em; margin-bottom:3vh; transition:opacity .3s}
  .subs{max-width:1100px; width:100%; min-height:18vh}
  .q{color:var(--muted); font-size:clamp(.85rem,2vw,1.2rem); margin-bottom:.7em; opacity:0; transition:opacity .4s}
  .q.show{opacity:.9} .q::before{content:"\201C"} .q::after{content:"\201D"}
  .a{font-size:clamp(1.2rem,3vw,2rem); line-height:1.4; color:var(--cream);
     opacity:0; transform:translateY(8px); transition:opacity .5s, transform .5s}
  .a.show{opacity:1; transform:none}
  .footer{position:fixed; bottom:3vh; left:0; right:0; text-align:center;
          color:var(--muted); font-size:.7rem; letter-spacing:.25em; opacity:.6; z-index:2}

  /* ===== SEÇİM EKRANI: dönen hologram carousel ===== */
  .chooser{position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
           justify-content:center; z-index:4}
  body[data-state="selection"] .chooser{display:flex}
  .chooser h1{font-family:"Georgia",serif; font-size:clamp(1.6rem,4vw,3rem); color:var(--gold-soft);
              text-shadow:0 0 30px #e6b94e44; margin-bottom:.4em}
  .chooser .prompt{margin-top:2vh; color:var(--gold-soft); letter-spacing:.14em;
                   font-size:clamp(1.05rem,2.6vw,1.7rem); text-shadow:0 0 24px #e6b94e44}
  .stage{position:relative; width:min(78vw,820px); height:min(46vh,420px); perspective:1300px; margin:2vh 0 1vh}
  /* yavaş yavaş dönen hologramlar — seçim yapılana dek */
  .cring{position:absolute; inset:0; transform-style:preserve-3d; animation:turn 40s linear infinite}
  @keyframes turn{to{transform:rotateY(360deg)}}
  .ccard{position:absolute; left:50%; top:50%; width:210px; height:300px; margin:-150px 0 0 -105px;
         transform-style:preserve-3d; text-align:center}
  /* SVG holografik figür kartı (fotoğraf değil) */
  .choloWrap{position:relative; width:210px; height:258px; border-radius:14px; overflow:hidden;
       background:radial-gradient(circle at 50% 30%, #0d2740 0%, #08172a 62%, #050c18 100%);
       border:1px solid #7fe9ff55; box-shadow:0 0 40px #7fe9ff2e, inset 0 0 46px #0009}
  .cholo{position:absolute; inset:0; width:100%; height:100%;
       filter:drop-shadow(0 0 5px #7fe9ffaa) drop-shadow(0 0 16px #38c6ff55);
       animation:holoflicker 4.5s linear infinite}
  /* ince tarama çizgileri (sürekli akan) */
  .choloWrap::after{content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
       background:repeating-linear-gradient(0deg,#7fe9ff00 0 2px,#7fe9ff16 2px 3px,#7fe9ff00 3px 5px);
       animation:holoscan 5.5s linear infinite}
  /* yukarıdan aşağı süzülen parlak tarama bandı */
  .choloWrap::before{content:""; position:absolute; left:0; right:0; height:40%; top:-40%; z-index:1;
       pointer-events:none; background:linear-gradient(#7fe9ff00,#7fe9ff22 58%,#7fe9ff00);
       animation:holoband 4.8s ease-in-out infinite}
  @keyframes holoscan{to{background-position:0 -110px}}
  @keyframes holoband{0%{top:-40%}58%,100%{top:118%}}
  @keyframes holoflicker{0%,100%{opacity:.92}47%{opacity:.85}50%{opacity:1}53%{opacity:.9}}
  .cname{margin-top:.6em; font-family:"Georgia",serif; font-size:1.25rem; color:var(--cream);
         letter-spacing:.04em; text-shadow:0 0 16px #e6b94e55}
  .cera{display:block; font-size:.7rem; color:var(--muted); letter-spacing:.1em; margin-top:.2em}
  .listening-pulse{margin-top:2vh; color:var(--holo); letter-spacing:.2em; font-size:.85rem;
                   opacity:.55; animation:breathe 2s ease-in-out infinite}

  /* ===== AÇILIŞ HAZIRLIK OVERLAY'İ (modeller ısınana dek) ===== */
  .boot{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:2.4vh;
        background:radial-gradient(900px 600px at 50% 40%, #1a1436 0%, var(--bg1) 55%, var(--bg0) 100%);
        transition:opacity .6s ease}
  .boot.hidden{opacity:0; pointer-events:none}
  .bootspin{width:66px; height:66px; border-radius:50%;
        border:4px solid #e6b94e2e; border-top-color:var(--gold);
        animation:spin 1s linear infinite}
  .boottext{color:var(--gold-soft); letter-spacing:.14em;
        font-size:clamp(1.1rem,2.8vw,1.7rem); text-shadow:0 0 24px #e6b94e44}
  .bootsub{color:var(--muted); letter-spacing:.1em; font-size:.85rem}
</style>
</head>
<body data-state="idle">
  <div class="brand">NİZAMİYE MEDRESESİ<small>İLİM &amp; HİKMET MECLİSİ</small></div>
  <span class="dot" id="dot" title="bağlantı"></span>

  <!-- Açılış hazırlık overlay'i: modeller (STT/TTS/RAG) ısınana dek gösterilir -->
  <div class="boot" id="boot">
    <div class="bootspin"></div>
    <div class="boottext">Âlimler hazırlanıyor…</div>
    <div class="bootsub">Sistem başlatılıyor, lütfen birkaç saniye bekleyin</div>
  </div>

  <!-- Seçim ekranı: dönen hologramlar -->
  <div class="chooser">
    <h1>Kiminle konuşmak istersin?</h1>
    <div class="stage"><div class="cring" id="cring"></div></div>
    <div class="prompt">Konuşmak istediğin âlimin ismini söyle</div>
    <div class="listening-pulse">● Seni dinliyorum</div>
  </div>

  <!-- Seçilen karakter görünümü -->
  <div class="wrap">
    <div class="name" id="cname">Nizamiye Medresesi</div>
    <div class="tagline" id="ctag">İSMİNİ SÖYLE</div>
    <div class="orb-wrap">
      <div class="thinker"></div>
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="orb"></div>
    </div>
    <div class="status" id="status">Hoş geldin</div>
    <div class="subs"><div class="q" id="q"></div><div class="a" id="a"></div></div>
  </div>

  <div class="footer" id="footer">NİZAMİYE MEDRESESİ · İLİM YOLU</div>

<script>
(function(){
  const body=document.body, dot=document.getElementById('dot');
  const statusEl=document.getElementById('status'), qEl=document.getElementById('q'), aEl=document.getElementById('a');
  const nameEl=document.getElementById('cname'), tagEl=document.getElementById('ctag'), footEl=document.getElementById('footer');
  const cring=document.getElementById('cring');
  const LABEL={
    idle:"Hazırım", welcome:"Hoş geldin evladım", listening:"Seni dinliyorum…",
    selection:"İsmini söyle…", thinking:"Düşünüyorum…", speaking:"Anlatıyorum…",
    farewell:"Hoşça kal evladım", error:"Bir aksaklık oldu"
  };
  let characters={}, idleTimer=null;

  function setState(s){
    body.dataset.state=s;
    statusEl.textContent=LABEL[s]||"";
    if(s==='listening'||s==='welcome'||s==='idle'){
      clearTimeout(idleTimer);
      idleTimer=setTimeout(()=>{ if(body.dataset.state!=='speaking'){ qEl.classList.remove('show'); aEl.classList.remove('show'); } }, 12000);
    }
  }
  function setCharacter(id){
    const p=characters[id]; if(!p) return;
    nameEl.textContent=p.name;
    tagEl.textContent=(p.era||"").toUpperCase();
    footEl.textContent=p.name.toUpperCase()+(p.era?(" · "+p.era):"");
    qEl.classList.remove('show'); aEl.classList.remove('show');
  }
  // === Holografik SVG figür (fotoğraf yerine — "hologram gibi") ===
  // Karaktere özel amblem: El-Cezerî=çark/dişli, Gazâlî=açık kitap, diğer=yıldız.
  const HOLO_EMBLEM={
    cezeri:'<g transform="translate(105,206)" stroke="#cdf6ff" stroke-opacity=".92" fill="none">'+
      '<circle r="14" fill="#7fe9ff" fill-opacity=".16" stroke-width="1.6"/><circle r="5.5" stroke-width="1.4"/>'+
      '<g stroke-width="2.4" stroke-linecap="round">'+
      '<line y1="-14" y2="-19"/><line y1="14" y2="19"/><line x1="-14" x2="-19"/><line x1="14" x2="19"/>'+
      '<line x1="-10" y1="-10" x2="-13.4" y2="-13.4"/><line x1="10" y1="10" x2="13.4" y2="13.4"/>'+
      '<line x1="10" y1="-10" x2="13.4" y2="-13.4"/><line x1="-10" y1="10" x2="-13.4" y2="13.4"/></g></g>',
    gazali:'<g transform="translate(105,205)" stroke="#cdf6ff" stroke-width="1.5" stroke-opacity=".92" fill="#7fe9ff" fill-opacity=".16">'+
      '<path d="M0,-9 C-6,-13 -15,-13 -19,-10 L-19,9 C-15,6 -6,6 0,9 C6,6 15,6 19,9 L19,-10 C15,-13 6,-13 0,-9 Z"/>'+
      '<line x1="0" y1="-9" x2="0" y2="9" stroke-width="1.4"/><g stroke-width=".9" stroke-opacity=".5">'+
      '<line x1="-15" y1="-5" x2="-4" y2="-4.4"/><line x1="-15" y1="0" x2="-4" y2=".4"/><line x1="-15" y1="5" x2="-4" y2="5.4"/>'+
      '<line x1="4" y1="-4.4" x2="15" y2="-5"/><line x1="4" y1=".4" x2="15" y2="0"/><line x1="4" y1="5.4" x2="15" y2="5"/></g></g>',
    nizamulmulk:'<g transform="translate(105,205)" stroke="#cdf6ff" stroke-width="1.5" stroke-opacity=".92" fill="none" stroke-linecap="round">'+
      '<line x1="0" y1="-14" x2="0" y2="9"/><line x1="-15" y1="-10" x2="15" y2="-10"/>'+
      '<circle cx="0" cy="-14" r="1.8" fill="#cdf6ff" stroke="none"/><line x1="-9" y1="9" x2="9" y2="9"/>'+
      '<line x1="-15" y1="-10" x2="-15" y2="-6"/><line x1="15" y1="-10" x2="15" y2="-6"/>'+
      '<path d="M-20,-6 A5 5 0 0 0 -10,-6 Z" fill="#7fe9ff" fill-opacity=".18"/>'+
      '<path d="M10,-6 A5 5 0 0 0 20,-6 Z" fill="#7fe9ff" fill-opacity=".18"/></g>',
    alparslan:'<g transform="translate(105,204)" stroke="#cdf6ff" stroke-width="1.5" stroke-opacity=".92" fill="#7fe9ff" fill-opacity=".14">'+
      '<path d="M0,-15 C-9,-12 -14,-10 -14,-4 C-14,7 -7,13 0,16 C7,13 14,7 14,-4 C14,-10 9,-12 0,-15 Z"/>'+
      '<path d="M5,-5 A7.5 7.5 0 1 0 5,9 A5.6 5.6 0 1 1 5,-5 Z" fill="#cdf6ff" fill-opacity=".55" stroke="none"/></g>'
  };
  function emblemFor(p){ return HOLO_EMBLEM[p.id]||
    '<g transform="translate(105,205)" stroke="#cdf6ff" stroke-width="1.6" stroke-opacity=".9" fill="#7fe9ff" fill-opacity=".16">'+
    '<path d="M0,-13 3.5,-4 13,-4 5.5,2.5 8.5,12 0,5.5 -8.5,12 -5.5,2.5 -13,-4 -3.5,-4 Z"/></g>'; }
  function holoSVG(p){
    const u=(p.id||p.name||'x').replace(/[^a-z0-9]/gi,'');
    return '<svg class="cholo" viewBox="0 0 210 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'+
      '<defs>'+
      '<linearGradient id="hb'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdf6ff"/>'+
      '<stop offset=".5" stop-color="#3fd2ff"/><stop offset="1" stop-color="#0a6ea0"/></linearGradient>'+
      '<radialGradient id="hbase'+u+'" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#aef0ff" stop-opacity=".9"/>'+
      '<stop offset="1" stop-color="#1ea0d8" stop-opacity="0"/></radialGradient></defs>'+
      '<polygon points="105,150 168,246 42,246" fill="#7fe9ff" opacity=".06"/>'+
      '<ellipse cx="105" cy="246" rx="70" ry="14" fill="url(#hbase'+u+')"/>'+
      '<ellipse cx="105" cy="246" rx="50" ry="7.5" fill="none" stroke="#bdf6ff" stroke-width="1.2" opacity=".7"/>'+
      '<g fill="url(#hb'+u+')" fill-opacity=".20" stroke="#9fefff" stroke-width="1.5" stroke-opacity=".92" stroke-linejoin="round">'+
      '<path d="M58,238 C56,198 70,170 90,161 L120,161 C140,170 154,198 152,238 Z"/>'+      /* omuz/cübbe */
      '<path d="M96,152 L114,152 L114,164 L96,164 Z" fill-opacity=".28"/>'+                 /* boyun */
      '<ellipse cx="105" cy="122" rx="25" ry="29"/>'+                                       /* baş */
      '<path d="M83,126 C84,152 96,170 105,170 C114,170 126,152 127,126 C120,138 90,138 83,126 Z" fill-opacity=".26"/>'+ /* sakal */
      '<path d="M66,98 C66,72 90,58 105,58 C120,58 144,72 144,98 C144,100 142,102 138,102 C128,88 82,88 72,102 C68,102 66,100 66,98 Z"/>'+ /* sarık */
      '<ellipse cx="105" cy="94" rx="34" ry="15" fill-opacity=".15"/></g>'+                 /* sarık vurgu */
      '<path d="M97,118 q8,-6 16,0" stroke="#cdf6ff" stroke-width="1" stroke-opacity=".55" fill="none"/>'+ /* kaş */
      emblemFor(p)+
      '<g stroke="#7fe9ff" stroke-width="1" opacity=".16"><line x1="70" y1="112" x2="140" y2="112"/>'+
      '<line x1="60" y1="152" x2="150" y2="152"/><line x1="56" y1="200" x2="154" y2="200"/></g>'+
      '</svg>';
  }
  // Carousel kartlarını kur (dönen holografik figürler)
  function buildCarousel(list){
    cring.innerHTML='';
    const n=Math.max(list.length,1), radius= n<=2?300: (n<=3?320:360);
    list.forEach((p,i)=>{
      const ang=(360/n)*i;
      const card=document.createElement('div');
      card.className='ccard';
      card.style.transform=`rotateY(${ang}deg) translateZ(${radius}px)`;
      const holo=document.createElement('div');
      holo.className='choloWrap';
      holo.innerHTML=holoSVG(p);
      const nm=document.createElement('div'); nm.className='cname';
      nm.innerHTML=p.name+'<span class="cera">'+(p.era||'')+'</span>';
      card.appendChild(holo); card.appendChild(nm); cring.appendChild(card);
    });
  }
  fetch('/api/v1/characters').then(r=>r.json()).then(j=>{
    // API sözleşmesi: düz dizi döner ([{id,name,era,...}]). Eski {characters:[...]}
    // biçimini de tolere et.
    const list = Array.isArray(j) ? j : (j.characters||[]);
    list.forEach(p=>characters[p.id]=p);
    buildCarousel(list);
    const cur = Array.isArray(j) ? null : j.current;
    if(cur) setCharacter(cur);
  }).catch(()=>{});

  function wsURL(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/events'; }
  let ws;
  function connect(){
    ws=new WebSocket(wsURL());
    ws.onopen=()=>dot.classList.add('on');
    ws.onclose=()=>{ dot.classList.remove('on'); setTimeout(connect,1500); };
    ws.onerror=()=>{ try{ws.close()}catch(e){} };
    ws.onmessage=(ev)=>{
      let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      const d=m.data||{};
      if(m.type==='state_changed' && d.new){ setState(d.new); }
      else if(m.type==='character_selected'){ if(d.persona_id) setCharacter(d.persona_id); }
      else if(m.type==='transcription_received'){ if(d.text){ qEl.textContent=d.text; qEl.classList.add('show'); aEl.classList.remove('show'); } }
      else if(m.type==='llm_response_completed'){ if(d.text){ aEl.textContent=d.text; aEl.classList.add('show'); } }
      else if(m.type==='session_started'){ qEl.classList.remove('show'); aEl.classList.remove('show'); }
      else if(m.type==='system_ready'){ markReady(); }
    };
  }
  connect();

  // === Açılış hazırlık kapısı: warmup bitene dek 'Hazırlanıyor…' overlay ===
  // İki sinyal (belt-and-suspenders): WS 'system_ready' olayı (anında) + /api/v1/status
  // yoklaması (olay kaçarsa veya WS geç bağlanırsa). İlk gelen overlay'i kaldırır.
  const bootEl=document.getElementById('boot');
  let bootDone=false;
  function markReady(){ if(bootDone) return; bootDone=true; bootEl.classList.add('hidden'); }
  (function pollReady(){
    if(bootDone) return;
    fetch('/api/v1/status').then(r=>r.json()).then(j=>{
      if(j&&j.ready){ markReady(); } else { setTimeout(pollReady,1000); }
    }).catch(()=>setTimeout(pollReady,1500));
  })();
  document.addEventListener('dblclick',()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); });
})();
</script>
</body>
</html>
