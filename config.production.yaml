# BilimFest — FESTIVAL PC profili (RTX 5060 Ti 8 GB VRAM, 32 GB RAM)
# Yükleme:  $env:BFEST_CONFIG="config.production.yaml"   (sonra uvicorn / script)
# Laptop (4060 8 GB, geliştirme) için config.yaml; festival makinesinde bu dosya.
#
# === 16 GB+ VRAM'li bir festival makinesine geçersen (RTX 4080/4090/5080...) ===
#   llm.n_gpu_layers: -1          # tüm katmanlar GPU → 30-50 tok/s
#   llm.model_path:  qwen2.5-14b-instruct-q4_k_m.gguf  + chat_format: ""  (Qwen ChatML)
#   rag.embedding_device: "cuda"  # e5 + reranker GPU'da (~50ms), CPU yavaşlığı biter
# (8 GB'da bunlar VRAM'e sığmaz / cuDNN çakışır — aşağıdaki güvenli değerler kalsın.)

app:
  name: "bilimfest"
  version: "1.0.0"
  environment: "production"

audio:
  input:
    device: "default"      # festival: Shure MV5 cihaz ID'sini ata (scripts/test_microphone.py ile bul)
    sample_rate: 16000
    channels: 1
  output:
    device: "default"      # festival: surround/hoparlör cihazı; 6 kanal Pepper's Ghost
    sample_rate: 24000
    channels: 6

stt:
  provider: "whisper_local"
  config:
    model: "data/models/whisper/faster-whisper-large-v3"
    language: "tr"
    device: "cuda"
    compute_type: "int8_float16"
    model_dir: "data/models/whisper"
    cpu_threads: 4
    num_workers: 1
    sample_rate: 16000
    beam_size: 5            # festival: kalite > hız
    best_of: 5
    temperature: 0.0
    initial_prompt: "El-Cezerî ile robot, otomat, fil saati, su saati, dişli çark, mıknatıs ve bilim hakkında Türkçe sohbet."
    vad_threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 250
    max_segment_duration_seconds: 30
    min_segment_duration_ms: 500
    flush_on_stream_end: true
    # Festival hardening: gürültülü ortamda halüsinasyon/yanlış-tetik savunması
    no_speech_threshold: 0.6
    min_avg_logprob: -1.0
    min_rms_threshold: 0.005
    apply_hallucination_blocklist: true

llm:
  provider: "llama_local"
  config:
    model_path: "data/models/llama/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    chat_format: "llama-3"   # Qwen'e geçersen "" yap (GGUF ChatML otomatik)
    # 8 GB VRAM: e5/reranker CPU'da, GPU'da Whisper(~3GB)+XTTS(~2GB) var → Llama'ya
    # ~3GB kalır. 5060 Ti + 32GB RAM ile 20 katman GPU + kalanı CPU dengeli.
    # OOM olursa 15'e düşür. 16 GB+ makinede -1 yap (yukarıdaki nota bak).
    n_gpu_layers: 20
    n_ctx: 4096
    n_batch: 512
    n_threads: 8
    use_mmap: true
    use_mlock: false
    verbose: false
    max_tokens: 120
    temperature: 0.4
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.15
  rag:
    enabled: true
    # RERANKER REJIMI (eşik reranker sigmoid skoruna uygulanır, embedding 0.86 DEĞİL).
    # 128 adversarial probe ile tune: 0.62 → bilinmeyen kişiler (Atatürk/Hawking/Messi)
    # + alan-dışı sorular DOĞRU şekilde LLM'e düşer, 0 zararlı yanlış hazır-cevap.
    similarity_threshold: 0.62
    margin: 0.0
    use_reranker: true
    reranker_model: "data/models/reranker/bge-reranker-v2-m3"
    store_path: "data/responses/vector_store"
    # 8 GB: e5 + reranker CPU (Whisper CTranslate2 ile cuDNN çakışmasını önler + VRAM
    # Llama'ya kalır). 16 GB+ makinede "cuda" yap → reranker ~50ms (CPU'da daha yavaş).
    embedding_device: "cpu"

tts:
  provider: "xtts_local"
  config:
    model_path: "data/models/xtts_v2"
    model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
    voices_dir: "data/voices"
    device: "cuda"
    language: "tr"
    builtin_speaker: "Damien Black"   # klon ref yoksa fallback
    speed: 1.1
    stream_chunk_size: 20
    output_chunk_samples: 480
    cache_enabled: true
    cache_dir: "data/tts_cache"
    cache_max_entries: 1000           # festival: 28 saat için geniş cache

# Festival günü Omniverse/Unreal kurulunca aşağıdaki gerçek sağlayıcılara çevir.
# Şimdilik mock → makine Omniverse/Unreal olmadan da sorunsuz çalışır.
lipsync:
  provider: "mock"
  config: {}
  # provider: "audio2face"
  # config: { host: "127.0.0.1", port: 8011, sample_rate: 24000 }

unreal_bridge:
  provider: "mock"
  udp_host: "127.0.0.1"
  udp_port: 12345
  tcp_host: "127.0.0.1"
  tcp_port: 12346
  # provider: "live_link"   # Unreal MetaHuman aktifken

session:
  max_duration_seconds: 180
  silence_timeout_seconds: 15

metrics:
  prometheus_port: 9090
  log_level: "INFO"
  json_logs: true
