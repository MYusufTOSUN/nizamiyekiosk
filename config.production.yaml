# BilimFest — sergi makinesi (RTX 4090 / 4080 / 4070 Ti Super, 16+ GB VRAM)
# Bu config aceasync.local.yaml kapatılması durumunda main config olarak kullanılır.
# Yükleme:  BFEST_CONFIG=config.production.yaml uvicorn ...
#
# Laptop (8 GB VRAM) için config.yaml; sergi makinesinde bu dosya.

app:
  name: "bilimfest"
  version: "1.0.0"
  environment: "production"

audio:
  input:
    device: "default"      # sergi makinesinde Shure MV5 ID'sini ata
    sample_rate: 16000
    channels: 1
  output:
    device: "default"      # 5.1 Genelec surround
    sample_rate: 24000
    channels: 6

stt:
  provider: "whisper_local"
  config:
    model: "data/models/whisper/faster-whisper-large-v3"
    language: "tr"
    device: "cuda"
    compute_type: "int8_float16"
    model_dir: "data/models/whisper"
    cpu_threads: 4
    num_workers: 1
    sample_rate: 16000
    beam_size: 5            # sergi makinesi: kalite > hız, beam 5 geri açıldı
    best_of: 5
    temperature: 0.0
    # Çocuk telaffuzunda domain terim/isim algısını artırır (bkz config.yaml notu).
    initial_prompt: "El-Cezerî ile robot, otomat, fil saati, su saati, dişli çark, mıknatıs ve bilim hakkında Türkçe sohbet."
    vad_threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 250
    max_segment_duration_seconds: 30
    min_segment_duration_ms: 500
    flush_on_stream_end: true
    no_speech_threshold: 0.6
    min_avg_logprob: -1.0
    min_rms_threshold: 0.005
    apply_hallucination_blocklist: true

llm:
  provider: "llama_local"
  config:
    # SERGI: Qwen 2.5 14B Instruct (Türkçe kalitesi Llama 3.1 8B'den belirgin
    # daha iyi). Q4_K_M ~9 GB → 16 GB VRAM'de tam GPU offload sığar.
    model_path: "data/models/llama/qwen2.5-14b-instruct-q4_k_m.gguf"
    # Boş → GGUF'a gömülü ChatML şablonu otomatik (Qwen için doğru). "llama-3" DEĞİL.
    chat_format: ""
    n_gpu_layers: -1        # SERGI: tüm katmanlar GPU'da
    n_ctx: 4096
    n_batch: 512
    n_threads: 4
    use_mmap: true
    use_mlock: false
    verbose: false
    max_tokens: 150         # 100 → 150: sergi makinesinde uzunluk lüksü
    temperature: 0.4        # daha az saçmalama/rambling
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.15
  rag:
    enabled: true
    # RERANKER REJIMI (bkz config.yaml notu). 128 adversarial probe ile tune:
    # reranker 0.62 → tüm bilinmeyen kişiler + alan-dışı doğru LLM'e düşer,
    # 0 zararlı yanlış hazır-cevap. Embedding-only "X tanıyor musun" şablonunda
    # Atatürk'ü Einstein'a yapıştırıyordu. Reranker top-12 + match_text-only
    # (hız). Veri seti laptopla ortak.
    similarity_threshold: 0.62
    margin: 0.0
    use_reranker: true
    reranker_model: "data/models/reranker/bge-reranker-v2-m3"
    store_path: "data/responses/vector_store"
    # Sergi makinesi 16+ GB, tek cuDNN yığını → e5 + reranker GPU'da güvenli ve
    # hızlı (reranker ~50ms). (Laptop config.yaml'da cuDNN çakışması için cpu.)
    embedding_device: "cuda"

tts:
  provider: "xtts_local"
  config:
    model_path: "data/models/xtts_v2"
    model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
    voices_dir: "data/voices"
    device: "cuda"                # sergi: hızlı GPU TTS
    language: "tr"
    builtin_speaker: "Damien Black"
    speed: 1.1                    # klon sakin okunduğu için ~%10 canlandır
    stream_chunk_size: 20
    output_chunk_samples: 480
    cache_enabled: true
    cache_dir: "data/tts_cache"
    cache_max_entries: 1000       # sergi: daha fazla cache (28 saat)

lipsync:
  provider: "audio2face"           # sergi makinesinde Omniverse kurulu
  config:
    host: "127.0.0.1"
    port: 8011
    sample_rate: 24000

unreal_bridge:
  provider: "live_link"            # sergi: Unreal MetaHuman aktif
  udp_host: "127.0.0.1"
  udp_port: 12345
  tcp_host: "127.0.0.1"
  tcp_port: 12346

session:
  max_duration_seconds: 180
  silence_timeout_seconds: 15

metrics:
  prometheus_port: 9090
  log_level: "INFO"
  json_logs: true
