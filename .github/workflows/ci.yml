name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (base + dev only, no GPU extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy (core modules)
        run: mypy src/core src/intent src/orchestrator || true
        # NOT: GPU provider modülleri (whisper/llama/xtts) ağır bağımlılık
        # gerektirir; CI'da mock + core katmanı tip-kontrol edilir.

      - name: Pytest (not gpu)
        env:
          BFEST__STT__PROVIDER: mock
          BFEST__LLM__PROVIDER: mock
          BFEST__TTS__PROVIDER: mock
          BFEST__LIPSYNC__PROVIDER: mock
        run: pytest tests/ -q -m "not gpu"

  config-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Production config yüklenebiliyor mu
        run: |
          BFEST_CONFIG=config.production.yaml python -c "from src.core.config import AppConfig; c=AppConfig(); print('prod config OK', c.app.environment)"
