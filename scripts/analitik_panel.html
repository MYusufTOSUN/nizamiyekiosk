<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nizamiye — Canlı Analitik</title>
<style>
  :root{
    --bg:#0a0e1a; --kart:#121826; --kenar:#1f2a3d; --metin:#e6ebf5;
    --soluk:#8a97ad; --altin:#c8a24a; --yesil:#4ea87a; --kirmizi:#c25b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--metin);
       font:400 14px/1.55 "Segoe UI",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(10,14,26,.96);
         border-bottom:1px solid var(--kenar);padding:12px 18px;
         display:flex;gap:14px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(6px)}
  h1{margin:0;font:600 16px/1 "Segoe UI";letter-spacing:.02em}
  h1 span{color:var(--soluk);font-weight:400;font-size:13px}
  .filtre{display:flex;gap:6px;align-items:center;font-size:13px}
  select,input{background:var(--kart);color:var(--metin);border:1px solid var(--kenar);
               border-radius:5px;padding:5px 8px;font:inherit;font-size:13px}
  button{background:var(--kart);color:var(--metin);border:1px solid var(--kenar);
         border-radius:5px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{border-color:var(--altin)}
  button.etkin{background:var(--altin);color:#111;border-color:var(--altin);font-weight:600}
  main{padding:18px;display:grid;gap:16px;
       grid-template-columns:repeat(auto-fit,minmax(330px,1fr));max-width:1700px;margin:0 auto}
  .kart{background:var(--kart);border:1px solid var(--kenar);border-radius:9px;padding:14px 16px}
  .kart h2{margin:0 0 10px;font:600 13px/1 "Segoe UI";color:var(--soluk);
           text-transform:uppercase;letter-spacing:.08em}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .kpi div{background:#0d1320;border:1px solid var(--kenar);border-radius:7px;padding:11px 13px}
  .kpi b{display:block;font:600 24px/1.15 "Segoe UI";font-variant-numeric:tabular-nums}
  .kpi small{color:var(--soluk);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:start;padding:5px 8px;border-bottom:1px solid #18202f}
  th{color:var(--soluk);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  td.s{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cubuk{height:5px;background:var(--altin);border-radius:3px;min-width:2px}
  .genis{grid-column:1/-1}
  .bos{color:var(--soluk);padding:14px 0;text-align:center}
  .rozet{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
         background:#0d1320;border:1px solid var(--kenar);color:var(--soluk)}
  .canli{color:var(--yesil)} .kopuk{color:var(--kirmizi)}
  #gunGraf{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
  #gunGraf div{flex:1;background:var(--altin);border-radius:2px 2px 0 0;min-height:2px;position:relative}
  #gunGraf div span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
                    font-size:9.5px;color:var(--soluk);white-space:nowrap}
</style>
</head>
<body>

<header>
  <h1>Nizamiye Analitik <span id="durum">—</span></h1>
  <div class="filtre"><label>Kaynak</label>
    <select id="fKaynak"><option value="">hepsi</option>
      <option value="kiosk">kiosk</option><option value="web">web</option></select></div>
  <div class="filtre"><label>Karakter</label><select id="fKarakter"><option value="">hepsi</option></select></div>
  <div class="filtre"><label>Dil</label><select id="fDil"><option value="">hepsi</option></select></div>
  <div class="filtre"><label>Başlık</label><select id="fBaslik"><option value="">hepsi</option></select></div>
  <div class="filtre"><label>Başlangıç</label><input type="date" id="fBas"></div>
  <div class="filtre"><label>Bitiş</label><input type="date" id="fBit"></div>
  <button id="bugun">Bugün</button>
  <button id="hepsi" class="etkin">Tümü</button>
  <button id="yenile">Yenile</button>
  <button id="oto" class="etkin">Otomatik ●</button>
  <button id="disaAktar">JSON indir</button>
</header>

<main id="govde"></main>

<script>
const $ = s => document.querySelector(s);
let otomatik = true, sonOzet = null;

function sorgu(){
  const p = new URLSearchParams();
  for (const [ad, sec] of [["kaynak","#fKaynak"],["karakter","#fKarakter"],
                           ["dil","#fDil"],["baslik","#fBaslik"]]) {
    const v = $(sec).value; if (v) p.set(ad, v);
  }
  if ($("#fBas").value) p.set("bas", $("#fBas").value);
  if ($("#fBit").value) p.set("bit", $("#fBit").value);
  return p.toString();
}

function tablo(baslik, nesne, birim){
  const g = Object.entries(nesne || {});
  if (!g.length) return `<div class="kart"><h2>${baslik}</h2><div class="bos">veri yok</div></div>`;
  const enb = Math.max(...g.map(x => x[1])) || 1;
  return `<div class="kart"><h2>${baslik}</h2><table>${
    g.slice(0, 30).map(([k, v]) => `<tr>
      <td>${k}</td>
      <td style="width:38%"><div class="cubuk" style="width:${(v/enb*100).toFixed(1)}%"></div></td>
      <td class="s">${typeof v === "number" ? v.toLocaleString("tr") : v}${birim||""}</td>
    </tr>`).join("")}</table></div>`;
}

function ciz(o){
  sonOzet = o;
  const qr = o.qr || {};
  const gunler = Object.entries(o.gun || {});
  const enb = Math.max(...gunler.map(x => x[1]), 1);

  $("#govde").innerHTML = `
    <div class="kart genis"><h2>Özet</h2><div class="kpi">
      <div><b>${(o.tekil_ziyaretci||0).toLocaleString("tr")}</b><small>tekil ziyaretçi</small></div>
      <div><b>${(o.oturum||0).toLocaleString("tr")}</b><small>oturum</small></div>
      <div><b>${(o.olay_sayilari?.soru_secildi||0).toLocaleString("tr")}</b><small>sorulan soru</small></div>
      <div><b>${(o.olay_sayilari?.klip_bitti||0).toLocaleString("tr")}</b><small>izlenen klip</small></div>
      <div><b>${(qr.gosterildi||0).toLocaleString("tr")}</b><small>QR gösterildi</small></div>
      <div><b>${(qr.siteye_geldi||0).toLocaleString("tr")}</b><small>QR okutuldu</small></div>
      <div><b>${qr.donusum_yuzde==null?"—":qr.donusum_yuzde+"%"}</b><small>QR dönüşümü</small></div>
      <div><b>${(o.toplam_olay||0).toLocaleString("tr")}</b><small>toplam olay</small></div>
    </div></div>

    <div class="kart genis"><h2>Gün gün</h2>
      <div id="gunGraf">${gunler.map(([g,v]) =>
        `<div style="height:${(v/enb*100).toFixed(1)}%" title="${g}: ${v}"><span>${g.slice(5)}</span></div>`
      ).join("") || '<div class="bos">veri yok</div>'}</div>
      <div style="height:20px"></div>
    </div>

    ${tablo("En çok sorulan sorular", o.sorular)}
    ${tablo("Karakterler", o.karakter)}
    ${tablo("Web başlıkları — görüntülenme", o.bolumler)}
    ${tablo("Web başlıkları — okuma süresi", o.bolum_sure_sn, " sn")}
    ${tablo("Düzenekler", o.duzenekler)}
    ${tablo("Klip tamamlanma", o.klip_tamamlanma_yuzde, "%")}
    ${tablo("Diller", o.dil)}
    ${tablo("Tüm olaylar", o.olay_sayilari)}
    ${tablo("Kaynak", o.kaynak)}
  `;
}

function secenekDoldur(sec, nesne){
  const el = $(sec), onceki = el.value;
  const anahtarlar = Object.keys(nesne || {});
  el.innerHTML = '<option value="">hepsi</option>' +
    anahtarlar.map(k => `<option value="${k}">${k}</option>`).join("");
  if (anahtarlar.includes(onceki)) el.value = onceki;
}

async function yukle(){
  try {
    const r = await fetch("/a/ozet?" + sorgu(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const o = await r.json();
    ciz(o);
    // Filtre secenekleri FILTRESIZ veriden gelmeli, yoksa daralinca kaybolur
    const r2 = await fetch("/a/ozet", {cache:"no-store"});
    if (r2.ok) {
      const t = await r2.json();
      secenekDoldur("#fKarakter", t.karakter);
      secenekDoldur("#fDil", t.dil);
      secenekDoldur("#fBaslik", t.bolumler);
    }
    $("#durum").innerHTML = `<span class="canli">● canlı</span> · ${new Date().toLocaleTimeString("tr")}`;
  } catch(e) {
    $("#durum").innerHTML = `<span class="kopuk">● toplayıcıya ulaşılamıyor</span>`;
  }
}

["#fKaynak","#fKarakter","#fDil","#fBaslik","#fBas","#fBit"]
  .forEach(s => $(s).addEventListener("change", yukle));
$("#yenile").addEventListener("click", yukle);
$("#bugun").addEventListener("click", () => {
  const g = new Date().toISOString().slice(0,10);
  $("#fBas").value = g; $("#fBit").value = g;
  $("#bugun").classList.add("etkin"); $("#hepsi").classList.remove("etkin"); yukle();
});
$("#hepsi").addEventListener("click", () => {
  $("#fBas").value = ""; $("#fBit").value = "";
  $("#hepsi").classList.add("etkin"); $("#bugun").classList.remove("etkin"); yukle();
});
$("#oto").addEventListener("click", () => {
  otomatik = !otomatik;
  $("#oto").classList.toggle("etkin", otomatik);
  $("#oto").textContent = otomatik ? "Otomatik ●" : "Otomatik ○";
});
$("#disaAktar").addEventListener("click", () => {
  if (!sonOzet) return;
  const b = new Blob([JSON.stringify(sonOzet, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "nizamiye-analitik-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
});

yukle();
setInterval(() => { if (otomatik) yukle(); }, 5000);
</script>
</body>
</html>
